<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>deskflop: zero</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent: #00f2fe;
            --accent-glow: rgba(0, 242, 254, 0.4);
            --bg-base: #030814;
            --glass-panel: rgba(10, 25, 47, 0.88);
            --glass-card: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(0, 242, 254, 0.15);
            --border-glass: rgba(0, 242, 254, 0.3);
            --text-main: #ffffff;
            --text-sub: #70e2ff;
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
            --desktop-bg: radial-gradient(circle at 50% 30%, #0a2540 0%, #020b18 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg-base); color: var(--text-main); }

        /* --- AUTH & BOOT GATEWAY --- */
        #boot-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #071e3d 0%, #010610 100%);
            z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #boot-screen.fade-out { opacity: 0; pointer-events: none; }
        
        .boot-brand-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; width: 100%; max-width: 360px; padding: 20px;
        }
        .boot-icon-glow {
            font-size: 64px; color: #ffffff;
            text-shadow: 0 0 30px var(--accent), 0 0 60px var(--accent);
            margin-bottom: 12px;
        }
        .boot-title {
            font-size: 32px; font-weight: 900; letter-spacing: 8px;
            background: linear-gradient(135deg, #ffffff, #70e2ff, #00f2fe);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: lowercase; margin-bottom: 4px;
        }
        .boot-subtitle {
            font-size: 10px; color: #ffffff; letter-spacing: 4px; font-weight: 700; margin-bottom: 24px; opacity: 0.9;
        }

        /* Authentication Box Styling */
        .auth-card {
            width: 100%; background: rgba(10, 25, 47, 0.6); backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass); border-radius: var(--radius-lg);
            padding: 24px; display: flex; flex-direction: column; gap: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(0, 242, 254, 0.1);
        }
        .auth-tabs { display: flex; border-bottom: 1px solid var(--border-glass); margin-bottom: 6px; }
        .auth-tab {
            flex: 1; text-align: center; padding: 8px; font-size: 12px; font-weight: 700;
            color: var(--text-sub); cursor: pointer; transition: 0.2s; border-bottom: 2px solid transparent;
        }
        .auth-tab.active { color: #ffffff; border-bottom-color: var(--accent); }
        .auth-input-group { display: flex; flex-direction: column; gap: 6px; }
        .auth-input-group label { font-size: 10px; color: var(--text-sub); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        #context-menu {
            position: absolute; display: none; background: var(--glass-panel); backdrop-filter: blur(25px);
            border: 1px solid var(--border-glass); border-radius: var(--radius-md); width: 220px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 1000000; padding: 6px; flex-direction: column; gap: 2px;
        }
        .ctx-header { font-size: 10px; font-weight: 800; color: var(--text-sub); padding: 6px 10px 2px; text-transform: uppercase; letter-spacing: 1px; }
        .ctx-item { padding: 8px 10px; border-radius: var(--radius-sm); font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 10px; color: var(--text-main); transition: 0.15s; }
        .ctx-item:hover { background: #ffffff; color: #020b18; font-weight: 600; }
        .ctx-item.danger:hover { background: #ff4757; color: white; }

        #desktop {
            width: 100vw; height: calc(100vh - 54px);
            background: var(--desktop-bg);
            position: relative; padding: 20px; display: flex; flex-direction: column; flex-wrap: wrap; align-content: flex-start; gap: 16px;
        }
        .app-icon {
            width: 88px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer;
            border-radius: var(--radius-md); padding: 10px 6px; border: 1px solid transparent; transition: all 0.2s ease;
        }
        .app-icon:hover { background: var(--glass-card); border-color: var(--border-glass); backdrop-filter: blur(10px); transform: translateY(-2px); }
        .app-icon i { font-size: 34px; filter: drop-shadow(0 4px 8px rgba(0,242,254,0.3)); }
        .app-icon img.custom-app-icon { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); }
        .app-icon span { font-size: 11px; font-weight: 600; text-align: center; text-shadow: 0 2px 4px rgba(0,0,0,0.9); color: #ffffff; word-break: break-word; }

        .os-window {
            position: absolute; width: 850px; height: 560px;
            background: var(--glass-panel); backdrop-filter: blur(25px);
            border: 1px solid var(--border-glass); border-radius: var(--radius-lg);
            display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 242, 254, 0.1); overflow: hidden;
            min-width: 400px; min-height: 280px; opacity: 0; transform: scale(0.95); transition: opacity 0.15s ease, transform 0.15s ease;
        }
        .os-window.active { opacity: 1; transform: scale(1); }
        .os-window.maximized { top: 0 !important; left: 0 !important; width: 100vw !important; height: calc(100vh - 54px) !important; border-radius: 0 !important; }
        
        .window-header {
            height: 42px; background: rgba(5, 15, 30, 0.95); display: flex; align-items: center; justify-content: space-between;
            padding-left: 14px; cursor: move; border-bottom: 1px solid var(--border-glass);
        }
        .window-title { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; color: #ffffff; }
        .window-controls { display: flex; height: 100%; }
        .control-btn { width: 46px; height: 100%; border: none; background: transparent; color: #ffffff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: 0.15s; }
        .control-btn:hover { background: var(--glass-hover); color: var(--accent); }
        .btn-close:hover { background: #ff4757; color: white; }
        .window-content { flex: 1; position: relative; background: #020813; overflow: auto; padding: 16px; display: flex; flex-direction: column; }

        #taskbar {
            width: 100vw; height: 54px; background: rgba(5, 15, 30, 0.92); backdrop-filter: blur(25px);
            position: absolute; bottom: 0; left: 0; display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; border-top: 1px solid var(--border-glass); z-index: 9999;
        }
        .taskbar-left { display: flex; align-items: center; gap: 8px; }
        .taskbar-center { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; }
        .taskbar-right { display: flex; align-items: center; gap: 12px; font-size: 11px; color: #ffffff; }
        .taskbar-btn {
            width: 42px; height: 42px; border-radius: var(--radius-md); border: 1px solid transparent; background: transparent;
            cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: #ffffff; position: relative; transition: 0.15s;
        }
        .taskbar-btn:hover { background: var(--glass-card); border-color: var(--border-glass); }
        .taskbar-btn.active-win { background: var(--glass-hover); border-color: var(--accent); }
        .taskbar-btn.active-win::after { content: ''; position: absolute; bottom: 3px; width: 14px; height: 3px; background: #ffffff; border-radius: 2px; box-shadow: 0 0 8px #ffffff; }

        .system-tray-group { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.06); padding: 6px 14px; border-radius: 30px; border: 1px solid var(--border-glass); }
        .tray-item { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; }

        #start-menu {
            position: absolute; bottom: 66px; left: 50%; transform: translateX(-50%) translateY(20px);
            width: 440px; height: 490px; background: var(--glass-panel); backdrop-filter: blur(30px);
            border: 1px solid var(--border-glass); border-radius: var(--radius-lg); box-shadow: 0 20px 60px rgba(0,0,0,0.9), 0 0 30px rgba(0, 242, 254, 0.15);
            display: none; opacity: 0; transition: all 0.2s ease; z-index: 9998; padding: 22px; flex-direction: column; justify-content: space-between;
        }
        #start-menu.active { display: flex; opacity: 1; transform: translateX(-50%) translateY(0); }
        .start-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
        .start-item { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; border-radius: var(--radius-md); cursor: pointer; border: 1px solid transparent; transition: 0.15s; }
        .start-item:hover { background: var(--glass-hover); border-color: var(--border-glass); }
        .start-item i { font-size: 26px; }
        .start-item span { font-size: 11px; font-weight: 500; }

        .btn-os { padding: 8px 16px; background: linear-gradient(135deg, #00f2fe, #00a8ff); border: none; color: #020b18; font-weight: 700; font-size: 12px; border-radius: var(--radius-sm); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: 0.15s; box-shadow: 0 4px 12px rgba(0,242,254,0.3); }
        .btn-os:hover { filter: brightness(1.2); transform: translateY(-1px); }
        input[type="text"], input[type="password"], textarea, select { width: 100%; background: rgba(0,10,25,0.7); border: 1px solid var(--border-glass); border-radius: var(--radius-sm); color: #ffffff; padding: 10px; outline: none; font-size: 12px; }
        input[type="text"]:focus, input[type="password"]:focus, select:focus { border-color: #ffffff; box-shadow: 0 0 8px var(--accent-glow); }

        .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; margin-top: 12px; }
        .store-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border-glass); border-radius: var(--radius-md); padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; transition: 0.2s; position: relative; }
        .store-card:hover { background: var(--glass-hover); transform: translateY(-2px); }
        .store-card i { font-size: 32px; }
        .store-card img.store-icon-img { width: 38px; height: 38px; border-radius: 8px; object-fit: cover; }
        .protected-badge { position: absolute; top: 8px; right: 8px; font-size: 10px; color: var(--accent); }

        .chat-container { display: flex; height: 100%; margin: -16px; background: #020813; }
        .chat-sidebar { width: 200px; border-right: 1px solid var(--border-glass); background: #051329; display: flex; flex-direction: column; }
        .chat-main { flex: 1; display: flex; flex-direction: column; }
        .server-item { padding: 10px 14px; border-bottom: 1px solid rgba(0, 242, 254, 0.1); font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; color: var(--text-sub); transition: 0.15s; }
        .server-item:hover, .server-item.active { background: var(--glass-hover); color: #ffffff; font-weight: 600; border-left: 3px solid var(--accent); }

        .about-card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-glass);
            border-radius: var(--radius-md); padding: 18px; margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <!-- AUTHENTICATION GATEWAY -->
    <div id="boot-screen">
        <div class="boot-brand-container">
            <i class="fa-solid fa-bolt-lightning boot-icon-glow"></i>
            <div class="boot-title">deskflop</div>
            <div class="boot-subtitle">ZERO</div>

            <div class="auth-card">
                <div class="auth-tabs">
                    <div class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Sign In</div>
                    <div class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">Create Account</div>
                </div>

                <div class="auth-input-group">
                    <label>Unique Handle</label>
                    <input type="text" id="auth-username" placeholder="Username (Unique)">
                </div>

                <div class="auth-input-group">
                    <label>Password</label>
                    <input type="password" id="auth-password" placeholder="••••••••">
                </div>

                <button class="btn-os" id="auth-submit-btn" onclick="handleAuthSubmit()">Sign In</button>
            </div>
        </div>
    </div>

    <div id="context-menu"></div>

    <div id="desktop" onclick="hideContext()">
        <div class="app-icon" data-app="about" onclick="openApp('about')">
            <i class="fa-solid fa-circle-info" style="color:#ffffff;"></i>
            <span>About</span>
        </div>
        <div class="app-icon" data-app="app_store" onclick="openApp('app_store')">
            <i class="fa-solid fa-store" style="color:#00f2fe;"></i>
            <span>App Store</span>
        </div>
        <div class="app-icon" data-app="app_publisher" onclick="openApp('app_publisher')">
            <i class="fa-solid fa-upload" style="color:#70e2ff;"></i>
            <span>Publisher</span>
        </div>
        <div class="app-icon" data-app="chat" onclick="openApp('chat')">
            <i class="fa-brands fa-discord" style="color:#38ef7d;"></i>
            <span>Chat Network</span>
        </div>
        <div class="app-icon" data-app="files" onclick="openApp('files')">
            <i class="fa-solid fa-box-archive" style="color:#00c6ff;"></i>
            <span>Files Vault</span>
        </div>
        <div class="app-icon" data-app="settings" onclick="openApp('settings')">
            <i class="fa-solid fa-sliders" style="color:#ffffff;"></i>
            <span>Settings</span>
        </div>
        <div id="custom-desktop-apps" style="display:contents;"></div>
    </div>

    <div id="start-menu">
        <div>
            <input type="text" placeholder="Search systems & apps..." style="border-radius:20px; padding:10px 16px;">
            <div class="start-grid">
                <div class="start-item" onclick="openApp('about'); toggleStart();"><i class="fa-solid fa-circle-info" style="color:#ffffff;"></i><span>About</span></div>
                <div class="start-item" onclick="openApp('app_store'); toggleStart();"><i class="fa-solid fa-store" style="color:#00f2fe;"></i><span>App Store</span></div>
                <div class="start-item" onclick="openApp('app_publisher'); toggleStart();"><i class="fa-solid fa-upload" style="color:#70e2ff;"></i><span>Publisher</span></div>
                <div class="start-item" onclick="openApp('chat'); toggleStart();"><i class="fa-brands fa-discord" style="color:#38ef7d;"></i><span>Chat</span></div>
                <div class="start-item" onclick="openApp('files'); toggleStart();"><i class="fa-solid fa-box-archive" style="color:#00c6ff;"></i><span>Files</span></div>
                <div class="start-item" onclick="openApp('settings'); toggleStart();"><i class="fa-solid fa-sliders" style="color:#ffffff;"></i><span>Settings</span></div>
            </div>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border-glass); padding-top:14px;">
            <div style="font-size:12px; font-weight:700; color:#ffffff;" id="start-user-label"><i class="fa-solid fa-user-gear"></i> Not Signed In</div>
            <button class="btn-os" style="font-size:10px; padding:4px 8px;" onclick="signOut()"><i class="fa-solid fa-right-from-bracket"></i> Sign Out</button>
        </div>
    </div>

    <div id="taskbar">
        <div class="taskbar-left">
            <button class="taskbar-btn" onclick="toggleStart()"><i class="fa-solid fa-bolt-lightning" style="color:#00f2fe;"></i></button>
        </div>
        <div class="taskbar-center" id="tb-apps"></div>
        <div class="taskbar-right">
            <div class="system-tray-group">
                <div class="tray-item" id="battery-display"><i class="fa-solid fa-battery-full" style="color:#00f2fe;"></i> 100%</div>
                <div class="tray-item" id="date-display">Jan 1</div>
                <div class="tray-item" style="font-weight:700; color:#00f2fe;" id="clock-display">00:00</div>
            </div>
        </div>
    </div>

    <div id="windows-container"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, push, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // --- IndexedDB Vault Setup ---
        const DB_NAME = 'DESKFLOP_ZERO_Vault';
        const DB_VERSION = 1;
        const STORE_NAME = 'app_blobs';

        function initVaultDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function saveBlobToVault(key, blob) {
            const db = await initVaultDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const req = store.put(blob, key);
                req.onsuccess = () => resolve(true);
                req.onerror = () => reject(req.error);
            });
        }

        async function getBlobFromVault(key) {
            const db = await initVaultDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function deleteBlobFromVault(key) {
            const db = await initVaultDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const req = store.delete(key);
                req.onsuccess = () => resolve(true);
                req.onerror = () => reject(req.error);
            });
        }

        // --- Firebase Integration ---
        const firebaseConfig = {
            apiKey: "AIzaSyB0_-Jf3b74dkFr2VsQ7OYq6DzPqN5lb6s",
            authDomain: "comet-os-v2.firebaseapp.com",
            databaseURL: "https://comet-os-v2-default-rtdb.firebaseio.com",
            projectId: "comet-os-v2",
            storageBucket: "comet-os-v2.firebasestorage.app",
            messagingSenderId: "74637587140",
            appId: "1:74637587140:web:d175ed8401267892db8f91",
            measurementId: "G-4J0P8167LY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let sysConfig = JSON.parse(localStorage.getItem('deskflop_zero_config')) || {
            username: null,
            accentColor: "#00f2fe"
        };

        let customWebApps = JSON.parse(localStorage.getItem('deskflop_zero_web_apps')) || [];
        let activeBlobUrls = {};
        let authMode = 'login'; // 'login' or 'register'

        function saveWebApps() {
            localStorage.setItem('deskflop_zero_web_apps', JSON.stringify(customWebApps));
            renderCustomWebApps();
        }

        function saveConfig() {
            localStorage.setItem('deskflop_zero_config', JSON.stringify(sysConfig));
            applyConfig();
        }

        function applyConfig() {
            document.documentElement.style.setProperty('--accent', sysConfig.accentColor);
            if (sysConfig.username) {
                document.getElementById('start-user-label').innerHTML = `<i class="fa-solid fa-user-gear"></i> ${sysConfig.username}`;
            }
        }

        // --- AUTHENTICATION & UNIQUE USERNAME VERIFICATION ---
        window.switchAuthTab = function(mode) {
            authMode = mode;
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-register').classList.toggle('active', mode === 'register');
            document.getElementById('auth-submit-btn').innerText = mode === 'login' ? 'Sign In' : 'Register Account';
        };

        window.handleAuthSubmit = async function() {
            const user = document.getElementById('auth-username').value.trim();
            const pass = document.getElementById('auth-password').value.trim();

            if (!user || !pass) {
                alert("Please fill in both fields.");
                return;
            }

            const cleanUserKey = user.toLowerCase().replace(/[^a-z0-9]/g, '_');
            const userRef = ref(db, `deskflop/users/${cleanUserKey}`);

            if (authMode === 'register') {
                const snapshot = await get(userRef);
                if (snapshot.exists()) {
                    alert("This handle is already taken. Please pick another name.");
                    return;
                }
                
                // Create account record under deskflop namespace
                await set(userRef, {
                    displayName: user,
                    password: pass,
                    createdAt: Date.now()
                });

                loginUser(user);
            } else {
                const snapshot = await get(userRef);
                if (!snapshot.exists()) {
                    alert("Account does not exist. Please register first.");
                    return;
                }
                
                const userData = snapshot.val();
                if (userData.password !== pass) {
                    alert("Invalid password.");
                    return;
                }

                loginUser(userData.displayName);
            }
        };

        function loginUser(username) {
            sysConfig.username = username;
            saveConfig();
            document.getElementById('boot-screen').classList.add('fade-out');
            setTimeout(() => document.getElementById('boot-screen').remove(), 800);
        }

        window.signOut = function() {
            sysConfig.username = null;
            localStorage.removeItem('deskflop_zero_config');
            location.reload();
        };

        window.addEventListener('DOMContentLoaded', () => {
            if (sysConfig.username) {
                applyConfig();
                document.getElementById('boot-screen').style.display = 'none';
            }
            renderCustomWebApps();
            initTrayClockAndBattery();
        });

        function initTrayClockAndBattery() {
            function updateClockDate() {
                const now = new Date();
                document.getElementById('clock-display').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                document.getElementById('date-display').innerText = now.toLocaleDateString([], { month: 'short', day: 'numeric' });
            }
            updateClockDate();
            setInterval(updateClockDate, 1000);

            if ('getBattery' in navigator) {
                navigator.getBattery().then(battery => {
                    function updateBattery() {
                        const level = Math.round(battery.level * 100);
                        const isCharging = battery.charging;
                        let iconClass = 'fa-battery-full';
                        if (level <= 20) iconClass = 'fa-battery-quarter';
                        else if (level <= 50) iconClass = 'fa-battery-half';
                        else if (level <= 80) iconClass = 'fa-battery-three-quarters';

                        document.getElementById('battery-display').innerHTML = `
                            <i class="fa-solid ${isCharging ? 'fa-bolt' : iconClass}" style="color:${isCharging ? '#00f2fe' : (level <= 20 ? '#ff4757' : '#00f2fe')};"></i> ${level}%
                        `;
                    }
                    updateBattery();
                    battery.addEventListener('levelchange', updateBattery);
                    battery.addEventListener('chargingchange', updateBattery);
                });
            }
        }

        // --- APP OWNERSHIP & APP STORE PROTECTION ---
        window.publishAppToStore = function() {
            const name = document.getElementById('pub-app-name').value.trim();
            const category = document.getElementById('pub-app-cat').value;
            const icon = document.getElementById('pub-app-icon').value;
            const customImageUrl = document.getElementById('pub-app-img-url').value.trim();
            const color = document.getElementById('pub-app-color').value.trim() || "#00f2fe";
            const url = document.getElementById('pub-app-url').value.trim();

            if (!name) { alert("App Title required!"); return; }
            if (!url && !pendingAppBlob) { alert("Please provide a site URL or an HTML File!"); return; }

            const cleanNameKey = name.toLowerCase().replace(/[^a-z0-9]/g, '_');

            // Check if app title already exists to prevent spoofing under deskflop/
            get(ref(db, `deskflop/app_store_titles/${cleanNameKey}`)).then((snapshot) => {
                if (snapshot.exists() && snapshot.val().author !== sysConfig.username) {
                    alert(`An app named "${name}" has already been published by another author (${snapshot.val().author}). You cannot claim or overwrite this name!`);
                    return;
                }

                // Reserve title ownership under deskflop/
                set(ref(db, `deskflop/app_store_titles/${cleanNameKey}`), { author: sysConfig.username });

                const doUpload = (htmlContent) => {
                    const payload = {
                        name, category, icon, color,
                        customImageUrl: customImageUrl || null,
                        author: sysConfig.username, // Bound permanently to logged in author
                        url: url || null,
                        htmlContent: htmlContent || null,
                        timestamp: Date.now()
                    };
                    push(ref(db, 'deskflop/app_store'), payload).then(() => {
                        alert(`App "${name}" published under protected credit to ${sysConfig.username}!`);
                        pendingAppBlob = null;
                        closeWin('app_publisher');
                    });
                };

                if (pendingAppBlob) {
                    const reader = new FileReader();
                    reader.onload = (evt) => doUpload(evt.target.result);
                    reader.readAsText(pendingAppBlob);
                } else {
                    doUpload(null);
                }
            });
        };

                        if (app.customImageUrl) {

                        }

                        const isOwner = app.author === sysConfig.username;

                        card.innerHTML = `
                            <i class="fa-solid fa-shield-halved protected-badge" title="Protected Ownership"></i>

        window.installAppFromStore = function(storeKey) {

                const appObj = snapshot.val();
                if (appObj) {
                    appObj.id = 'app_' + Date.now();
                    if (appObj.htmlContent) {
                        const blob = new Blob([appObj.htmlContent], { type: 'text/html' });

                        appObj.isVaultApp = true;
                        delete appObj.htmlContent;

        let serverList = [];

        function initChatEngine() {
            onValue(ref(db, 'deskflop/chat_servers'), (snapshot) => {
                const data = snapshot.val();
                serverList = [];
                if (data) {
                    Object.keys(data).forEach(sName => serverList.push(sName));
                }
                if (!serverList.includes('Global Chat')) {
                    set(ref(db, 'deskflop/chat_servers/Global Chat/claimedBy'), 'SYSTEM');
                    serverList.push('Global Chat');

                renderServerList(serverList);

            listenToChatServer(activeChatServer);

            container.innerHTML = '';

                item.className = `server-item ${srvName === activeChatServer ? 'active' : ''}`;
                item.innerHTML = `<i class="fa-solid fa-hashtag"></i> ${srvName}`;

                        claimedBy: sysConfig.username,
                        createdAt: Date.now()

        window.closeWin = function(id) {

                if (activeBlobUrls[id]) {

                    delete activeBlobUrls[id];
                }
                windows[id].remove();
                delete windows[id];
                renderTaskbar();
            }
        };

        window.toggleMax = function(id) { windows[id].classList.toggle('maximized'); };

        function focusWindow(win) {
            topZ++;
            win.style.zIndex = topZ;
        }

        window.dragWin = function(e, id) {
            const win = windows[id];
            focusWindow(win);
            let sx = e.clientX - win.offsetLeft, sy = e.clientY - win.offsetTop;
            function move(ev) { win.style.left = (ev.clientX - sx) + 'px'; win.style.top = (ev.clientY - sy) + 'px'; }
            function stop() { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', stop); }
            window.addEventListener('mousemove', move); window.addEventListener('mouseup', stop);
        };

        function renderTaskbar() {
            const c = document.getElementById('tb-apps');
            c.innerHTML = '';
            for (let id in windows) {
                const b = document.createElement('button');
                b.className = 'taskbar-btn active-win';
                
                let iconDisplay = `<i class="${appRegistry[id].icon}" style="color:${appRegistry[id].color}"></i>`;
                if (appRegistry[id].customImageUrl) {
                    iconDisplay = `<img src="${appRegistry[id].customImageUrl}" style="width:20px; height:20px; border-radius:4px; object-fit:cover;">`;
                }

                b.innerHTML = iconDisplay;
                b.onclick = () => focusWindow(windows[id]);
                c.appendChild(b);
            }
        }
    </script>
</body>
</html>
